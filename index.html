<!DOCTYPE html>
<html lang="ja" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempMail Pro - 捨てメアド作成 & 受信専用ボックス</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Google Fonts Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .dark ::-webkit-scrollbar-track { background: #0f172a; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Radar pulse animation for empty inbox */
    @keyframes radar-sweep {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .radar-pulse {
      animation: radar-sweep 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- App Brand -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20 text-white">
          <i data-lucide="mail-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
            TempMail Pro
            <span class="text-xs font-normal text-slate-500 dark:text-slate-400 hidden sm:inline-block">/ 捨てメアド作成 & 受信</span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">登録不要・完全匿名のメール受信ボックス</p>
        </div>
      </div>

      <!-- Connection Status & Top Controls -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div id="statusBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span id="statusText">オンライン</span>
        </div>

        <!-- Sound Alert Toggle -->
        <button id="soundToggleBtn" onclick="toggleSound()" title="着信音切り替え" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors border border-slate-200 dark:border-slate-700">
          <i id="soundIcon" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button id="themeToggleBtn" onclick="toggleTheme()" title="テーマ切り替え" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors border border-slate-200 dark:border-slate-700">
          <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Active Email Card -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden transition-colors">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
        
        <!-- Address & Domain Controls -->
        <div class="space-y-3 flex-1">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
              <i data-lucide="shield" class="w-3.5 h-3.5 text-brand-500"></i>
              現在の使い捨てアドレス
            </div>
            <!-- Auto sync countdown -->
            <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin text-brand-500" style="animation-duration: 4s;"></i>
              <span>自動同期: <span id="refreshTimer" class="font-mono-code font-bold text-slate-800 dark:text-slate-200">5</span>秒</span>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-3">
            <!-- Email Display -->
            <div id="emailDisplayContainer" class="flex-1 min-w-[280px] bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-3 flex items-center justify-between focus-within:border-brand-500 transition-colors shadow-inner">
              <span id="currentEmail" class="font-mono-code text-lg sm:text-xl font-bold text-brand-600 dark:text-brand-100 select-all truncate">
                生成中...
              </span>
              <span id="copySuccessBadge" class="hidden text-xs bg-emerald-500/20 text-emerald-600 dark:text-emerald-300 px-2.5 py-1 rounded-md font-sans font-medium ml-2 shrink-0">
                コピー完了!
              </span>
            </div>
            
            <!-- Quick Action Buttons -->
            <button onclick="copyAddress()" class="px-4 py-3 bg-brand-600 hover:bg-brand-500 active:scale-95 text-white font-medium rounded-xl transition-all shadow-md shadow-brand-600/20 flex items-center gap-2 text-sm">
              <i data-lucide="copy" class="w-4 h-4"></i>
              <span>コピー</span>
            </button>
            <button onclick="generateNewAddress()" class="px-4 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-800 dark:text-slate-200 font-medium rounded-xl border border-slate-300 dark:border-slate-700 transition-all flex items-center gap-2 text-sm">
              <i data-lucide="sparkles" class="w-4 h-4 text-brand-500"></i>
              <span>アドレス変更</span>
            </button>
            <button onclick="toggleQrModal()" class="p-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl border border-slate-300 dark:border-slate-700 transition-all" title="QRコードを表示">
              <i data-lucide="qr-code" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Domain Selector -->
          <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400 pt-1">
            <label for="domainSelect" class="font-medium">ドメイン変更:</label>
            <select id="domainSelect" onchange="changeDomain()" class="bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-1 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500 font-mono-code text-xs">
              <!-- Dynamically populated -->
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Inbox & Mail Reader Two-Column View -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[520px]">
      
      <!-- Inbox Column (5 Cols) -->
      <div class="lg:col-span-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-lg transition-colors">
        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/40">
          <div class="flex items-center gap-2">
            <h2 class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 text-sm">
              <i data-lucide="inbox" class="w-4 h-4 text-brand-500"></i> 受信トレイ
            </h2>
            <span id="unreadBadge" class="bg-brand-500/10 text-brand-600 dark:text-brand-300 text-xs font-bold px-2 py-0.5 rounded-full border border-brand-500/20">
              0件 未読
            </span>
          </div>
          <button onclick="fetchInbox(true)" title="今すぐ手動更新" class="text-xs text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-2.5 py-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-300 dark:border-slate-700 flex items-center gap-1.5">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> 手動更新
          </button>
        </div>

        <!-- Message List Container -->
        <div id="inboxList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60 max-h-[550px] relative">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Email Reader Column (7 Cols) -->
      <div class="lg:col-span-7 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-lg transition-colors min-h-[400px]">
        <div id="emailViewHeader" class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/40">
          <span class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
            <i data-lucide="mail-open" class="w-4 h-4 text-slate-400"></i> メッセージ詳細
          </span>
          <div id="emailViewActions" class="flex items-center gap-2 hidden">
            <button onclick="printEmail()" class="px-2.5 py-1 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg border border-slate-300 dark:border-slate-700 transition-colors flex items-center gap-1.5">
              <i data-lucide="printer" class="w-3.5 h-3.5"></i> 印刷
            </button>
            <button onclick="toggleRawModal()" class="px-2.5 py-1 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg border border-slate-300 dark:border-slate-700 transition-colors flex items-center gap-1.5">
              <i data-lucide="code" class="w-3.5 h-3.5"></i> ソース
            </button>
            <button onclick="deleteCurrentEmail()" class="px-2.5 py-1 text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-lg border border-rose-500/20 transition-colors flex items-center gap-1.5">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 削除
            </button>
          </div>
        </div>

        <!-- Mail Viewer Content -->
        <div id="emailViewContent" class="flex-1 p-6 overflow-y-auto max-h-[550px] bg-slate-50/30 dark:bg-slate-950/30 flex flex-col">
          <!-- Empty State Default -->
          <div class="my-auto text-center py-12 px-4">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-slate-200 dark:border-slate-700/50 shadow-inner">
              <i data-lucide="mail-search" class="w-8 h-8"></i>
            </div>
            <p class="text-slate-700 dark:text-slate-300 font-medium">メールが選択されていません</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
              左側の受信トレイからメッセージを選択して内容を確認できます。
            </p>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800 mt-auto py-4 bg-white/60 dark:bg-slate-900/60 text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>© TempMail Pro. ログイン不要・受信専用使い捨てメール</p>
      <div class="flex items-center gap-4 text-xs">
        <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i> 完全匿名性</span>
        <span class="inline-flex items-center gap-1 text-indigo-600 dark:text-indigo-400"><i data-lucide="zap" class="w-3.5 h-3.5"></i> リアルタイム受信</span>
      </div>
    </div>
  </footer>

  <!-- QR Code Modal -->
  <div id="qrModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl relative">
      <button onclick="toggleQrModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white p-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h3 class="font-bold text-lg text-slate-900 dark:text-white mb-1 text-center">モバイル共有用QRコード</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 text-center mb-4">スマートフォンカメラで簡単にアドレスを取得</p>
      <div class="bg-white p-4 rounded-xl flex justify-center shadow-inner mb-4 border border-slate-200" id="qrcodeContainer"></div>
      <p id="qrEmailText" class="text-xs font-mono-code text-center text-brand-600 dark:text-brand-300 break-all bg-slate-100 dark:bg-slate-950 p-2.5 rounded-lg border border-slate-200 dark:border-slate-800"></p>
    </div>
  </div>

  <!-- Raw View Modal -->
  <div id="rawModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 max-w-2xl w-full max-h-[80vh] flex flex-col shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-3">
        <h3 class="font-semibold text-slate-900 dark:text-slate-200 text-sm">RAW Source / Header</h3>
        <button onclick="toggleRawModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <pre id="rawContent" class="flex-1 bg-slate-950 p-4 rounded-xl text-xs font-mono-code text-emerald-400 overflow-auto border border-slate-800 whitespace-pre-wrap"></pre>
    </div>
  </div>

  <!-- JavaScript Engine -->
  <script>
    // ==========================================
    // Core App State & Config
    // ==========================================
    const CONFIG = {
      POLL_INTERVAL: 5,
      LOCAL_STORAGE_KEY: 'tempmail_pro_v2_data',
      THEME_KEY: 'tempmail_theme',
      MAIL_TM_BASE: 'https://api.mail.tm'
    };

    let state = {
      address: '',
      password: '',
      token: '',
      accountId: '',
      domains: [],
      selectedDomain: '',
      messages: [],
      selectedMsgId: null,
      soundEnabled: true,
      darkMode: true,
      apiMode: 'mail.tm',
      countdown: CONFIG.POLL_INTERVAL
    };

    let timerId = null;

    // ==========================================
    // Initialization & Theme Settings
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      loadState();
      await initEmailAccount();
      startPollingLoop();
      lucide.createIcons();
    });

    function initTheme() {
      const savedTheme = localStorage.getItem(CONFIG.THEME_KEY);
      if (savedTheme) {
        state.darkMode = savedTheme === 'dark';
      } else {
        state.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      applyTheme();
    }

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      localStorage.setItem(CONFIG.THEME_KEY, state.darkMode ? 'dark' : 'light');
      applyTheme();
    }

    function applyTheme() {
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      if (state.darkMode) {
        htmlEl.classList.add('dark');
        if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        htmlEl.classList.remove('dark');
        if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    // ==========================================
    // Web Audio Synthesizer (Chime sound)
    // ==========================================
    function playNotificationSound() {
      if (!state.soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {
        console.warn('Audio warning:', e);
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      const icon = document.getElementById('soundIcon');
      const btn = document.getElementById('soundToggleBtn');
      
      if (state.soundEnabled) {
        icon.setAttribute('data-lucide', 'volume-2');
        btn.classList.remove('text-rose-500');
      } else {
        icon.setAttribute('data-lucide', 'volume-x');
        btn.classList.add('text-rose-500');
      }
      lucide.createIcons();
      saveState();
    }

    // ==========================================
    // State Persistence
    // ==========================================
    function saveState() {
      try {
        localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify({
          address: state.address,
          password: state.password,
          token: state.token,
          accountId: state.accountId,
          messages: state.messages,
          soundEnabled: state.soundEnabled,
          apiMode: state.apiMode
        }));
      } catch(e) {
        console.error('Failed to save state', e);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(CONFIG.LOCAL_STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.address = parsed.address || '';
          state.password = parsed.password || '';
          state.token = parsed.token || '';
          state.accountId = parsed.accountId || '';
          state.messages = parsed.messages || [];
          state.soundEnabled = parsed.soundEnabled !== undefined ? parsed.soundEnabled : true;
          state.apiMode = parsed.apiMode || 'mail.tm';
        }
      } catch(e) {
        console.error('Failed to parse saved state', e);
      }
    }

    // ==========================================
    // Email Account Engine
    // ==========================================
    async function initEmailAccount() {
      updateStatusBadge('connecting', '接続中...');

      let domains = await fetchDomains();
      if (!domains || domains.length === 0) {
        enableMockMode('Mail.tm API接続不可のためデモ用ドメインで待機中');
        return;
      }

      state.domains = domains;
      populateDomainSelector(domains);

      if (state.address && state.token && state.apiMode === 'mail.tm') {
        document.getElementById('currentEmail').textContent = state.address;
        updateStatusBadge('online', 'オンライン');
        fetchInbox();
        return;
      }

      await createNewAccount(domains[0]);
    }

    async function fetchDomains() {
      try {
        const res = await fetch(`${CONFIG.MAIL_TM_BASE}/domains`, { timeout: 5000 });
        if (!res.ok) throw new Error('Domain fetch failed');
        const data = await res.json();
        return data['hydra:member'] ? data['hydra:member'].map(d => d.domain) : [];
      } catch (err) {
        console.warn('Mail.tm domains fetch failed:', err);
        return null;
      }
    }

    function populateDomainSelector(domains) {
      const select = document.getElementById('domainSelect');
      select.innerHTML = '';
      domains.forEach(dom => {
        const opt = document.createElement('option');
        opt.value = dom;
        opt.textContent = '@' + dom;
        select.appendChild(opt);
      });
      if (state.selectedDomain) {
        select.value = state.selectedDomain;
      }
    }

    async function createNewAccount(domain) {
      state.selectedDomain = domain || (state.domains[0] || 'tempmail.com');
      const randomUser = 'user_' + Math.random().toString(36).substring(2, 10);
      const email = `${randomUser}@${state.selectedDomain}`;
      const password = 'Pass_' + Math.random().toString(36).substring(2, 12);

      if (state.apiMode === 'mock') {
        state.address = email;
        state.messages = [];
        document.getElementById('currentEmail').textContent = state.address;
        renderInbox();
        saveState();
        return;
      }

      try {
        // Register account
        const regRes = await fetch(`${CONFIG.MAIL_TM_BASE}/accounts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: email, password: password })
        });

        if (!regRes.ok) throw new Error('Account registration failed');
        const regData = await regRes.json();

        // Get authentication token
        const tokenRes = await fetch(`${CONFIG.MAIL_TM_BASE}/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: email, password: password })
        });

        if (!tokenRes.ok) throw new Error('Token creation failed');
        const tokenData = await tokenRes.json();

        state.address = email;
        state.password = password;
        state.accountId = regData.id;
        state.token = tokenData.token;
        state.messages = [];
        state.selectedMsgId = null;

        document.getElementById('currentEmail').textContent = state.address;
        updateStatusBadge('online', 'オンライン');
        renderInbox();
        renderEmailDetail(null);
        saveState();

      } catch (err) {
        console.warn('API error, switching to Fallback Mode:', err);
        enableMockMode('API制限のためスタンドバイモードで動作中');
      }
    }

    function enableMockMode(msg) {
      state.apiMode = 'mock';
      state.domains = ['temp-mail.local', 'disposable.org', 'shield-box.jp'];
      populateDomainSelector(state.domains);
      
      if (!state.address) {
        const rand = Math.random().toString(36).substring(2, 8);
        state.address = `user_${rand}@temp-mail.local`;
      }
      
      document.getElementById('currentEmail').textContent = state.address;
      updateStatusBadge('mock', 'スタンバイ');

      renderInbox();
      saveState();
    }

    async function changeDomain() {
      const select = document.getElementById('domainSelect');
      state.selectedDomain = select.value;
      if (state.apiMode === 'mail.tm') {
        await createNewAccount(state.selectedDomain);
      } else {
        const username = state.address.split('@')[0] || 'user';
        state.address = `${username}@${state.selectedDomain}`;
        document.getElementById('currentEmail').textContent = state.address;
        saveState();
      }
    }

    async function generateNewAddress() {
      const select = document.getElementById('domainSelect');
      const targetDom = select.value || state.domains[0] || 'temp-mail.local';
      await createNewAccount(targetDom);
    }

    // ==========================================
    // Fetching Messages
    // ==========================================
    async function fetchInbox(isManual = false) {
      if (state.apiMode === 'mock') {
        return;
      }

      try {
        const res = await fetch(`${CONFIG.MAIL_TM_BASE}/messages`, {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });

        if (res.status === 401) {
          await createNewAccount(state.selectedDomain);
          return;
        }

        if (!res.ok) throw new Error('Fetch messages failed');

        const data = await res.json();
        const apiMsgs = data['hydra:member'] || [];

        let newArrived = false;

        for (let item of apiMsgs) {
          const exists = state.messages.find(m => m.id === item.id);
          if (!exists) {
            newArrived = true;
            const detailRes = await fetch(`${CONFIG.MAIL_TM_BASE}/messages/${item.id}`, {
              headers: { 'Authorization': `Bearer ${state.token}` }
            });
            let fullMsg = item;
            if (detailRes.ok) {
              fullMsg = await detailRes.json();
            }

            state.messages.unshift({
              id: fullMsg.id,
              from: fullMsg.from.name ? `${fullMsg.from.name} <${fullMsg.from.address}>` : fullMsg.from.address,
              to: state.address,
              subject: fullMsg.subject || '(無題)',
              date: new Date(fullMsg.createdAt).toLocaleString('ja-JP'),
              html: fullMsg.html || fullMsg.text || '',
              text: fullMsg.text || '',
              read: false,
              raw: JSON.stringify(fullMsg, null, 2)
            });
          }
        }

        if (newArrived) {
          playNotificationSound();
          saveState();
          renderInbox();
        }

      } catch (err) {
        console.warn('Fetch error:', err);
      }
    }

    // ==========================================
    // UI Rendering
    // ==========================================
    function renderInbox() {
      const container = document.getElementById('inboxList');
      const unreadBadge = document.getElementById('unreadBadge');

      const unreadCount = state.messages.filter(m => !m.read).length;
      unreadBadge.textContent = `${unreadCount}件 未読`;

      if (state.messages.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center my-auto flex flex-col items-center justify-center min-h-[350px]">
            <div class="relative flex items-center justify-center mb-6">
              <div class="absolute w-20 h-20 bg-brand-500/20 rounded-full radar-pulse"></div>
              <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 text-brand-500 rounded-full flex items-center justify-center relative z-10 border border-slate-300 dark:border-slate-700 shadow-sm">
                <i data-lucide="radio" class="w-6 h-6"></i>
              </div>
            </div>
            <p class="text-slate-700 dark:text-slate-300 font-medium">メールの到着を待っています...</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-xs">
              受信トレイは ${CONFIG.POLL_INTERVAL} 秒ごとに自動で新しいメッセージを確認します。
            </p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = state.messages.map(msg => {
        const isSelected = msg.id === state.selectedMsgId;
        const activeClass = isSelected 
          ? 'bg-brand-50 dark:bg-brand-600/15 border-l-4 border-l-brand-500' 
          : 'hover:bg-slate-50 dark:hover:bg-slate-800/60 border-l-4 border-l-transparent';
        const unreadClass = !msg.read ? 'font-bold text-slate-900 dark:text-slate-100' : 'text-slate-500 dark:text-slate-400';

        return `
          <div onclick="selectEmail('${msg.id}')" class="p-4 cursor-pointer transition-colors ${activeClass}">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs ${unreadClass} truncate max-w-[200px] flex items-center gap-1.5">
                ${!msg.read ? '<span class="w-2 h-2 rounded-full bg-brand-500 inline-block shrink-0"></span>' : ''}
                ${escapeHtml(msg.from)}
              </span>
              <span class="text-[10px] text-slate-400 dark:text-slate-500 shrink-0">${msg.date.split(' ')[1] || msg.date}</span>
            </div>
            <h4 class="text-sm font-semibold ${msg.read ? 'text-slate-700 dark:text-slate-300' : 'text-slate-900 dark:text-white'} truncate">${escapeHtml(msg.subject)}</h4>
            <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-1">${escapeHtml(msg.text || '').substring(0, 60)}...</p>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function selectEmail(msgId) {
      const msg = state.messages.find(m => m.id === msgId);
      if (!msg) return;

      msg.read = true;
      state.selectedMsgId = msgId;
      saveState();
      renderInbox();
      renderEmailDetail(msg);
    }

    function renderEmailDetail(msg) {
      const contentPane = document.getElementById('emailViewContent');
      const actionsPane = document.getElementById('emailViewActions');

      if (!msg) {
        actionsPane.classList.add('hidden');
        contentPane.innerHTML = `
          <div class="my-auto text-center py-12 px-4">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-slate-200 dark:border-slate-700/50 shadow-inner">
              <i data-lucide="mail-search" class="w-8 h-8"></i>
            </div>
            <p class="text-slate-700 dark:text-slate-300 font-medium">メールが選択されていません</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
              左側の受信トレイからメッセージを選択して内容を確認できます。
            </p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      actionsPane.classList.remove('hidden');

      contentPane.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2 shadow-sm">
            <h2 class="text-lg font-bold text-slate-900 dark:text-white break-words">${escapeHtml(msg.subject)}</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-100 dark:border-slate-800 text-slate-500 dark:text-slate-400">
              <div><strong class="text-slate-700 dark:text-slate-300">差出人:</strong> ${escapeHtml(msg.from)}</div>
              <div><strong class="text-slate-700 dark:text-slate-300">宛先:</strong> ${escapeHtml(msg.to)}</div>
              <div class="col-span-full"><strong class="text-slate-700 dark:text-slate-300">日時:</strong> ${msg.date}</div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200 text-sm overflow-x-auto min-h-[250px] leading-relaxed shadow-inner" id="emailBodyFrame">
            ${cleanAndRenderHtml(msg.html || msg.text)}
          </div>
        </div>
      `;

      lucide.createIcons();
    }

    function deleteCurrentEmail() {
      if (!state.selectedMsgId) return;
      state.messages = state.messages.filter(m => m.id !== state.selectedMsgId);
      state.selectedMsgId = null;
      saveState();
      renderInbox();
      renderEmailDetail(null);
    }

    function cleanAndRenderHtml(htmlOrText) {
      if (!htmlOrText) return '<p class="text-slate-400 italic">本文はありません</p>';
      
      const hasHtml = /<[a-z][\s\S]*>/i.test(htmlOrText);
      if (!hasHtml) {
        return `<pre class="whitespace-pre-wrap font-sans">${escapeHtml(htmlOrText)}</pre>`;
      }

      let safeHtml = htmlOrText
        .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
        .replace(/on\w+="[^"]*"/g, '')
        .replace(/javascript:/gi, '');

      return safeHtml;
    }

    // ==========================================
    // Polling Loop
    // ==========================================
    function startPollingLoop() {
      if (timerId) clearInterval(timerId);

      timerId = setInterval(() => {
        state.countdown--;
        if (state.countdown <= 0) {
          state.countdown = CONFIG.POLL_INTERVAL;
          fetchInbox();
        }
        document.getElementById('refreshTimer').textContent = state.countdown;
      }, 1000);
    }

    // ==========================================
    // Status Badge Helpers
    // ==========================================
    function updateStatusBadge(status, text) {
      const badge = document.getElementById('statusBadge');
      const textEl = document.getElementById('statusText');
      textEl.textContent = text;

      if (status === 'online') {
        badge.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
      } else if (status === 'mock') {
        badge.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20';
      } else {
        badge.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20';
      }
    }

    // ==========================================
    // Utilities
    // ==========================================
    function copyAddress() {
      const email = state.address;
      if (!email) return;

      const tempInput = document.createElement('input');
      tempInput.value = email;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);

      const badge = document.getElementById('copySuccessBadge');
      badge.classList.remove('hidden');
      setTimeout(() => badge.classList.add('hidden'), 2000);
    }

    function toggleQrModal() {
      const modal = document.getElementById('qrModal');
      const isHidden = modal.classList.contains('hidden');

      if (isHidden) {
        modal.classList.remove('hidden');
        document.getElementById('qrEmailText').textContent = state.address;

        const container = document.getElementById('qrcodeContainer');
        container.innerHTML = '';
        new QRCode(container, {
          text: state.address,
          width: 180,
          height: 180,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleRawModal() {
      const modal = document.getElementById('rawModal');
      const isHidden = modal.classList.contains('hidden');

      if (isHidden) {
        const msg = state.messages.find(m => m.id === state.selectedMsgId);
        if (!msg) return;
        document.getElementById('rawContent').textContent = msg.raw || JSON.stringify(msg, null, 2);
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function printEmail() {
      const msg = state.messages.find(m => m.id === state.selectedMsgId);
      if (!msg) return;

      const printWin = window.open('', '_blank');
      printWin.document.write(`
        <html>
          <head>
            <title>印刷 - ${escapeHtml(msg.subject)}</title>
            <style>
              body { font-family: sans-serif; padding: 20px; color: #111; }
              .header { border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
              .title { font-size: 20px; font-weight: bold; }
              .meta { font-size: 12px; color: #555; margin-top: 5px; }
            </style>
          </head>
          <body>
            <div class="header">
              <div class="title">${escapeHtml(msg.subject)}</div>
              <div class="meta"><strong>From:</strong> ${escapeHtml(msg.from)}</div>
              <div class="meta"><strong>To:</strong> ${escapeHtml(msg.to)}</div>
              <div class="meta"><strong>Date:</strong> ${msg.date}</div>
            </div>
            <div>${msg.html || msg.text}</div>
          </body>
        </html>
      `);
      printWin.document.close();
      printWin.focus();
      printWin.print();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
